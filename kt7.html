<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #87ceeb;
    height: 100vh;
  }
  
  .road {
    position: absolute;
    bottom: 100px;
    width: 100%;
    height: 4px;
    background: #333;
  }
  
  .car {
    position: absolute;
    bottom: 104px;
    left: 0;
    width: 200px;
    height: 60px;
    animation: drive 3s ease-out forwards;
  }
  
  /* кузов */
  .car::before {
    content: "";
    position: absolute;
    bottom: 15px;
    left: 0;
    width: 200px;
    height: 35px;
    background: #e63946;
    border-radius: 10px 25px 5px 5px;
  }
  
  /* крыша */
  .car::after {
    content: "";
    position: absolute;
    bottom: 45px;
    left: 40px;
    width: 100px;
    height: 20px;
    background: #e63946;
    border-radius: 15px 20px 0 0;
    box-shadow: inset 15px 0 0 -5px #1d3557, inset -15px 0 0 -5px #1d3557;
  }
  
  /* колёса */
  .wheel {
    position: absolute;
    bottom: 0;
    width: 40px;
    height: 40px;
    background: #111;
    border-radius: 50%;
    border: 6px solid #333;
    box-sizing: border-box;
  }
  
  .wheel::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    background: #888;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  
  .w1 { left: 20px; }
  .w2 { right: 20px; }
  
  @keyframes drive {
    from { left: -200px; }
    to   { left: calc(100% - 250px); }
  }
</style>
</head>
<body>
  <div class="road"></div>
  <div class="car">
    <div class="wheel w1"></div>
    <div class="wheel w2"></div>
  </div>
</body>
</html>
